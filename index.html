<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Годекан — Теречное кофе | Отзывы</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f1eb;
  color:#171717;
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:18px 16px 40px;
}

.hero{
  background:#171717;
  color:white;
  border-radius:28px;
  padding:34px 24px 28px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.14);
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

h1{
  margin:0;
  font-size:29px;
  letter-spacing:-.8px;
}

.subtitle{
  margin:9px 0 0;
  color:#cfcfcf;
  font-size:14px;
}

.location{
  margin-top:18px;
  font-size:13px;
  color:#bdbdbd;
}

.card{
  background:white;
  border-radius:22px;
  margin-top:16px;
  padding:22px;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
}

.card h2{
  font-size:20px;
  margin:0 0 16px;
}

.rating{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:5px 0 18px;
}

.star{
  border:0;
  background:#f0ede7;
  color:#aaa;
  width:48px;
  height:48px;
  border-radius:14px;
  font-size:25px;
  cursor:pointer;
}

.star.active{
  background:#171717;
  color:#fff;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd8cf;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  outline:none;
  background:#faf9f6;
  margin-bottom:11px;
  font-family:inherit;
}

textarea{
  min-height:115px;
  resize:vertical;
}

button.send{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#171717;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.note{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:10px;
}

.summary{
  display:flex;
  align-items:center;
  gap:20px;
}

.big-rating{
  font-size:42px;
  font-weight:800;
  line-height:1;
}

.small-stars{
  font-size:19px;
  letter-spacing:2px;
}

.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.review{
  padding:17px 0;
  border-bottom:1px solid #eee;
}

.review:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.review-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.name{
  font-weight:700;
}

.date{
  font-size:12px;
  color:#999;
}

.review-stars{
  font-size:14px;
  margin:7px 0;
  color:#222;
}

.review-text{
  margin:0;
  line-height:1.5;
  font-size:14px;
  color:#444;
}

.footer{
  text-align:center;
  color:#999;
  font-size:12px;
  padding:22px 0;
}
</style>
</head>

<body>

<div class="wrap">

  <section class="hero">
    <div class="logo">☕</div>

    <h1>ГОДЕКАН</h1>

    <div class="subtitle">
      ТЕРЕЧНОЕ КОФЕ
    </div>

    <div class="location">
      Теречное · Отзывы наших гостей
    </div>
  </section>


  <section class="card">

    <h2>Оставить отзыв</h2>

    <div class="rating" id="rating">

      <button class="star" data-value="1">
        ★
      </button>

      <button class="star" data-value="2">
        ★
      </button>

      <button class="star" data-value="3">
        ★
      </button>

      <button class="star" data-value="4">
        ★
      </button>

      <button class="star" data-value="5">
        ★
      </button>

    </div>


    <input
      id="name"
      placeholder="Ваше имя"
    >


    <textarea
      id="text"
      placeholder="Расскажите, как вам у нас ☕"
    ></textarea>


    <button
      class="send"
      onclick="sendReview()"
    >
      Оставить отзыв
    </button>


    <div class="note">
      Спасибо, что помогаете нам становиться лучше ❤️
    </div>

  </section>


  <section class="card">

    <h2>Отзывы гостей</h2>


    <div class="summary">

      <div>

        <div class="big-rating">
          4.9
        </div>

        <div class="small-stars">
          ★★★★★
        </div>
